name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  NEXT_STATIC_EXPORT: "true"
  NEXT_PUBLIC_BASE_PATH: /PORTFOLIO-
  NEXT_PUBLIC_SITE_URL: https://shihabbk18.github.io/PORTFOLIO-

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static portfolio
        run: pnpm build:next

      - name: Check out existing GestureCam compatibility demo
        uses: actions/checkout@v6
        with:
          repository: shihabbk18/gesturecam-fx
          ref: 938349d366644f4a3f77c71e73aebef38e0261be
          path: .legacy-gesturecam
          persist-credentials: false

      - name: Set up Node.js for the compatibility demo
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .legacy-gesturecam/frontend/package-lock.json

      - name: Preserve the existing GestureCam demo address
        working-directory: .legacy-gesturecam/frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          mkdir -p ../../out/gesturecam-fx
          cp -R dist/. ../../out/gesturecam-fx/
          touch ../../out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
